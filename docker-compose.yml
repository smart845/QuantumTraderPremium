version: '3.9'
services:
  bot:
    build: .
    container_name: quantumtrader_bot
    restart: always
    env_file:
      - .env
    command: ["python","run_bot.py"]

  ton_checker:
    build: .
    container_name: quantumtrader_ton_checker
    restart: always
    env_file:
      - .env
    command: ["python","core/subscription_checker.py"]


# Added healthcheck for dashboard_secure
services:
  dashboard_secure:
    build: .
    command: ["uvicorn","dashboard_secure.secure_app:app","--host","0.0.0.0","--port","8000"]
    environment:
      - HEALTH_URL=http://localhost:8000/healthz
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD","python","scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
