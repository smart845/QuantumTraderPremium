<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Insight</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100">
<div class="mx-auto max-w-5xl px-4 py-6">
  <h2 class="text-xl font-semibold mb-4">AI Insight</h2>
  <div class="text-sm text-gray-400 mb-2">Обновлено: {{ data.updated_at }}</div>
  <div class="grid gap-3">
    {% for s in data.insights %}
      <div class="bg-gray-800 rounded p-4 flex items-center justify-between">
        <div>
          <div class="text-sm text-gray-400">{{ s.ts }} · {{ s.symbol }}</div>
          <div class="text-lg font-bold {% if s.direction=='LONG' %}text-emerald-400{% else %}text-rose-400{% endif %}">{{ s.direction }} · {{ (s.confidence*100)|round(1) }}%</div>
          <div class="text-sm text-gray-300">Причина: {{ s.reason }}</div>
        </div>
      </div>
    {% endfor %}
  </div>
  <a class="inline-block mt-6 px-3 py-2 bg-blue-600 rounded" href="/">Назад</a>
</div>
</body>
</html>
